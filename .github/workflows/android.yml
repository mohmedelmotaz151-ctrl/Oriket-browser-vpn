name: Android APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        if: "!startsWith(github.ref, 'refs/tags/v')"
        run: gradle assembleDebug
      - name: Upload debug APK artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: Oriket-Browser-VPN-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare release signing key
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ORKET_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::Configure GitHub Actions secrets ORKET_KEYSTORE_BASE64, ORKET_KEYSTORE_PASSWORD, ORKET_KEY_ALIAS, and ORKET_KEY_PASSWORD before publishing a release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orkeit-release.jks"
      - name: Build signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ORKET_KEYSTORE_PATH: ${{ runner.temp }}/orkeit-release.jks
          ORKET_KEYSTORE_PASSWORD: ${{ secrets.ORKET_KEYSTORE_PASSWORD }}
          ORKET_KEY_ALIAS: ${{ secrets.ORKET_KEY_ALIAS }}
          ORKET_KEY_PASSWORD: ${{ secrets.ORKET_KEY_PASSWORD }}
        run: |
          VERSION_NAME="${GITHUB_REF_NAME#v}"
          gradle assembleRelease -PVERSION_CODE="$GITHUB_RUN_NUMBER" -PVERSION_NAME="$VERSION_NAME"
      - name: Upload signed release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: Oriket-Browser-VPN-release
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish APK release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          generate_release_notes: true
